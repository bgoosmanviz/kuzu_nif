name: Build precompiled NIFs

on:
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.17"]
        job:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-20.04, use-cross: true }

    steps:
    - uses: actions/checkout@v3

    - name: Extract project version
      shell: bash
      run: |
        echo "PROJECT_VERSION=$(sed -n 's/^  @version "\(.*\)"/\1/p' mix.exs | head -n1)" >> $GITHUB_ENV

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        target: ${{ matrix.job.target }}

    - name: Install build dependencies
      run: |
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt-get update
        sudo apt-get install -y musl-tools cmake gcc-11 g++-11

    - name: Configure build environment
      run: |
        echo "CC=gcc-11" >> $GITHUB_ENV
        echo "CXX=g++-11" >> $GITHUB_ENV
        echo "CXXFLAGS=-std=c++20 -fconcepts-ts" >> $GITHUB_ENV
        echo "CFLAGS=-std=c11" >> $GITHUB_ENV

    - name: Build the project
      id: build-crate
      uses: philss/rustler-precompiled-action@v1.0.1
      env:
        CXXFLAGS: "-std=c++20 -fconcepts-ts"
        CFLAGS: "-std=c11"
        RUSTFLAGS: "-C target-feature=-crt-static"
        CC: gcc-11
        CXX: g++-11
      with:
        project-name: kuzu_nif
        project-version: ${{ env.PROJECT_VERSION }}
        target: ${{ matrix.job.target }}
        nif-version: ${{ matrix.nif }}
        use-cross: ${{ matrix.job.use-cross }}
        project-dir: "native/kuzu_ex"

    - name: Artifact upload
      uses: actions/upload-artifact@v3
      with:
        name: ${{ steps.build-crate.outputs.file-name }}
        path: ${{ steps.build-crate.outputs.file-path }}

    - name: Publish archives and packages
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ steps.build-crate.outputs.file-path }}
      if: startsWith(github.ref, 'refs/tags/')