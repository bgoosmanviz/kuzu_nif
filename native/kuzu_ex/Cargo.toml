[package]
name = "kuzu_ex"
version = "0.6.0"
authors = []
edition = "2021"

[lib]
name = "kuzu_ex"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
arrow-array = { version = "43.0.0" }
kuzu = { version = "0.7.1", features = ["arrow"] }
# rustler = "0.34.0"
rustler = { version = "0.34.0", default-features = false, features = ["derive"] }
polars-arrow = { version = "0.43.1", features = ["arrow_rs"] }
arrow-schema = { version = "43.0.0" }

[dependencies.polars]
version = "0.43.1"

[features]
default = ["nif_version_2_17"]
nif_version_2_17 = ["rustler/nif_version_2_17"]
